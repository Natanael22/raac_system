spring:
  application:
    name: raac_system-api
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:raac_system}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Let Flyway handle migrations
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

aws:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket-name: ${S3_BUCKET:raac-system-bucket}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}

tiss:
  mock:
    scenario: ALWAYS_APPROVE # Options: ALWAYS_APPROVE, ALWAYS_DENY, PENDING, TIMEOUT, EXPIRED_CARD, INVALID_CRED
    pending-seconds: 10

jwt:
  # Base64 encoded private/public keys or path to keystore
  # For MVP we can load from a hardcoded base64 key or generate dynamically
  expirationMs: 1800000 # 30 min
  refreshExpirationMs: 86400000

raac:
  encryption:
    key: ${RAAC_ENCRYPTION_KEY:12345678901234567890123456789012}

server:
  port: 8080
  
logging:
  level:
    br.com.raac_system: DEBUG
